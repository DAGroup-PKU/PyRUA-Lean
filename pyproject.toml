[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrualean"
version = "0.2.0"
description = "A pyautogui-style robot library for code policies over RPent primitives"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "PyRUA-Lean Contributors"}]
keywords = ["robotics", "code-as-policy", "libero", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
# The RoboColiseum robot (GenieSim's G2): its bridge, perception and the benchmark's own arm
# IK, ik_solver, which is not on PyPI: its wheels from genie_sim's 3rdparty/, at a fixed commit
# (Linux x86_64, Python 3.11 or 3.12).
robocoliseum = [
    "numpy",
    "pillow",
    "scipy",
    "msgpack",
    "websockets>=13",
    "ik_solver @ https://github.com/AgibotTech/genie_sim/raw/a2bbec0c0e2d05f7cb5c13c9a75bcbc16ea229be/3rdparty/ik_solver-0.4.3-cp311-cp311-linux_x86_64.whl ; python_version == '3.11' and platform_machine == 'x86_64' and sys_platform == 'linux'",
    "ik_solver @ https://github.com/AgibotTech/genie_sim/raw/a2bbec0c0e2d05f7cb5c13c9a75bcbc16ea229be/3rdparty/ik_solver-0.4.3-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and platform_machine == 'x86_64' and sys_platform == 'linux'",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.8",
    "numpy",
    "pillow",
    # the in-process MCP server of `play` (RPent's environments already ship these);
    # it uses the lowlevel Server API of mcp 1.x, which mcp 2 removed
    "mcp>=1.8,<2",
    "uvicorn",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/DAGroup-PKU/PyRUA-Lean"
Repository = "https://github.com/DAGroup-PKU/PyRUA-Lean"
Issues = "https://github.com/DAGroup-PKU/PyRUA-Lean/issues"

[project.scripts]
pyrualean = "pyrualean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyrualean = ["knowledge/*.md", "codex-catalog-gpt-6-astra-fallback.json", "hosts/robocoliseum_ik/*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["runs"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
