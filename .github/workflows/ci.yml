name: ci
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python tools/check_release.py
      - run: python -m ruff check src tests eval eval_libero eval_robocasa tools transfer
      - run: bash tools/test_offline.sh python
